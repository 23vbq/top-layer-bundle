name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.5'
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: composer phpstan -- --no-progress

  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        symfony:
          - '6.4.*'
          - '7.4.*'
          - '8.*'
        dependencies:
          - highest
        exclude:
          - php: '8.2'
            symfony: '8.*'
          - php: '8.3'
            symfony: '8.*'
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: lowest
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          custom-cache-suffix: symfony-${{ matrix.symfony }}

      - run: composer test
